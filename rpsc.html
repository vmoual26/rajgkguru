<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPSC परीक्षाएं — RAJ G.K. GURU</title>
<meta name="description" content="RPSC (राजस्थान लोक सेवा आयोग) की परीक्षाओं के लिए मुफ़्त और प्रीमियम प्रैक्टिस टेस्ट सीरीज़।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css?v=10">
<link rel="stylesheet" href="shared/features.css?v=2">
</head>
<body>

<header id="site-header"></header>

<main class="board-page">
  <h1>📘 RPSC परीक्षाएं</h1>
  <p class="sub">Rajasthan Public Service Commission की परीक्षाओं में से अपनी परीक्षा चुनें।</p>
  <div class="home-search">
    <span class="ico" aria-hidden="true">🔎</span>
    <input id="exam-search" type="search" autocomplete="off" placeholder="इस सूची में खोजें — जैसे पटवारी, Lecturer…" aria-label="परीक्षा खोजें">
  </div>
  <div id="exam-rows" class="exam-rows"></div>
  <p class="sub" id="no-match" hidden>कोई परीक्षा नहीं मिली — दूसरा शब्द आज़माएं।</p>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { renderHeader, renderFooter } from "./shared/chrome.js?v=6";
  import { loadCalendar, sortByNearestDate, nearestBySlug, daysUntil, formatDate } from "./shared/calendar.js?v=1";
  import { matchExams } from "./shared/examsearch.js?v=2";
  renderHeader(document.getElementById("site-header"), "rpsc");
  renderFooter(document.getElementById("site-footer"));

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  Promise.all([fetch("exams.json").then((r) => r.json()), loadCalendar()]).then(([{ exams }, events]) => {
    const near = nearestBySlug(events);
    const list = sortByNearestDate(exams.filter((e) => e.board === "RPSC"), events);
    const box = document.getElementById("exam-rows");
    const row = (e) => {
      const live = e.status === "live", ev = near[e.slug], n = ev ? daysUntil(ev.date) : null;
      return `<a class="exam-row ${live ? "" : "soon"}" href="${live ? e.slug + "/" : "#"}" data-slug="${e.slug}">
        <span class="er-ico">📘</span>
        <span class="er-body"><span class="er-title">${esc(e.title)}</span>
          <span class="er-meta" style="display:block">${live ? "अभी उपलब्ध" : "जल्द आ रहा है"}${ev ? ` · 📅 ${formatDate(ev.date)} · ${n === 0 ? "आज" : n + " दिन शेष"}` : ""}</span></span>
        <span class="er-go">→</span></a>`;
    };
    const draw = (items) => {
      box.innerHTML = items.map(row).join("");
      document.getElementById("no-match").hidden = items.length > 0;
    };
    draw(list);
    document.getElementById("exam-search").addEventListener("input", (ev) => {
      const t = ev.target.value.trim();
      draw(t ? matchExams(list, t) : list);
    });
  });
</script>

</body>
</html>
