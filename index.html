<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAJ G.K. GURU — Test Series | Aldhru Academy</title>
<meta name="description" content="राजस्थान की प्रतियोगी परीक्षाओं (RPSC, RSMSSB) के लिए मुफ़्त और प्रीमियम प्रैक्टिस टेस्ट सीरीज़।">
<meta property="og:title" content="RAJ G.K. GURU — Test Series">
<meta property="og:description" content="राजस्थान की प्रतियोगी परीक्षाओं (RPSC, RSMSSB) के लिए मुफ़्त और प्रीमियम प्रैक्टिस टेस्ट सीरीज़।">
<meta property="og:image" content="/shared/icon-512.png">
<meta name="theme-color" content="#9333ea">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css?v=10">
<link rel="stylesheet" href="shared/features.css?v=2">
</head>
<body>

<header id="site-header"></header>

<main class="home">
  <!-- members only: their exams, one tap from the top of the home page -->
  <section class="my-exams" id="my-exams" hidden></section>

  <h1 class="home-intro">राजस्थान की परीक्षाओं की तैयारी — <span>अपनी परीक्षा खोजें</span></h1>
  <div class="home-search">
    <span class="ico" aria-hidden="true">🔎</span>
    <input id="exam-search" type="search" autocomplete="off" placeholder="परीक्षा खोजें — जैसे पटवारी, RAS, Sub Inspector…" aria-label="परीक्षा खोजें">
    <div class="search-results" id="search-results" hidden></div>
  </div>
  <div class="search-chips" id="search-chips">
    <button class="chip-btn" data-q="RAS">RAS</button>
    <button class="chip-btn" data-q="पटवारी">पटवारी</button>
    <button class="chip-btn" data-q="Sub Inspector">Sub Inspector</button>
    <button class="chip-btn" data-q="Lecturer">Lecturer</button>
    <button class="chip-btn" data-q="CET">CET</button>
  </div>

  <div class="board-tiles">
    <a class="board-tile" href="/rpsc.html"><b>📘 RPSC</b><small id="tile-rpsc">राजस्थान लोक सेवा आयोग</small><span class="go">सभी परीक्षाएं →</span></a>
    <a class="board-tile rmssb" href="/rmssb.html"><b>📗 RSMSSB</b><small id="tile-rmssb">कर्मचारी चयन बोर्ड</small><span class="go">सभी परीक्षाएं →</span></a>
  </div>

  <div class="home-sec-title"><span id="pop-title">🔥 लोकप्रिय परीक्षाएं</span></div>
  <div class="pop-grid" id="pop-grid"></div>

  <div class="home-sec-title"><span>📚 आज की पढ़ाई</span></div>
  <div id="daily-section"></div>

  <div class="home-trust">
    <span>✔ असली PYQ आधारित</span><span>✔ आधिकारिक उत्तर-कुंजी</span><span>✔ स्वतंत्र उत्तर-जाँच</span>
    <a href="/about.html">हमारी गुणवत्ता प्रक्रिया →</a>
  </div>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { renderHeader, renderFooter } from "./shared/chrome.js?v=6";
  import { loadCalendar, nearestBySlug, daysUntil, formatDate } from "./shared/calendar.js?v=1";
  import { renderDaily } from "./shared/qotd.js?v=2";
  import { mountDropdownSearch } from "./shared/examsearch.js?v=2";
  renderHeader(document.getElementById("site-header"), "home");
  renderFooter(document.getElementById("site-footer"), { showQuery: true });

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Always-popular exams, used to fill the 4 featured slots after the ones whose date is nearest.
  const POPULAR = ["raj-state-and-sub-services-comb-comp-exam-ras-rts", "patwari", "sub-inspector-comb-comp-exam", "school-lecturer", "sr-teacher-gr-2", "cet-senior-secondary"];

  Promise.all([fetch("exams.json").then((r) => r.json()), loadCalendar()]).then(([{ exams }, events]) => {
    const live = exams.filter((e) => e.status === "live");
    const bySlug = Object.fromEntries(live.map((e) => [e.slug, e]));
    const near = nearestBySlug(events);

    document.getElementById("tile-rpsc").textContent = `${live.filter((e) => e.board === "RPSC").length} परीक्षाएं · राजस्थान लोक सेवा आयोग`;
    document.getElementById("tile-rmssb").textContent = `${live.filter((e) => e.board === "RMSSB").length} परीक्षाएं · कर्मचारी चयन बोर्ड`;

    // 4 featured exams: those with the nearest upcoming date (within 120 days) first, then the evergreen popular ones
    const soon = live.filter((e) => near[e.slug] && daysUntil(near[e.slug].date) <= 120)
      .sort((a, b) => near[a.slug].date.localeCompare(near[b.slug].date)).slice(0, 2);
    const picked = [...soon];
    for (const slug of POPULAR) { if (picked.length >= 4) break; if (bySlug[slug] && !picked.includes(bySlug[slug])) picked.push(bySlug[slug]); }
    document.getElementById("pop-title").textContent = soon.length ? "🔥 जल्द आने वाली व लोकप्रिय परीक्षाएं" : "🔥 लोकप्रिय परीक्षाएं";
    document.getElementById("pop-grid").innerHTML = picked.map((e) => {
      const ev = near[e.slug], n = ev ? daysUntil(ev.date) : null;
      return `<a class="pop-card" href="${e.slug}/">
        ${ev ? `<span class="pc-days">📅 ${formatDate(ev.date)} · ${n === 0 ? "आज" : n + " दिन"}</span>` : ""}
        <span class="pc-title">${esc(e.title)}</span>
        <span class="pc-meta">${esc(e.board)} · अभी अभ्यास शुरू करें →</span></a>`;
    }).join("");

    const search = mountDropdownSearch({ input: document.getElementById("exam-search"), results: document.getElementById("search-results"), exams: live, hrefFor: (e) => `${e.slug}/` });
    document.querySelectorAll("#search-chips .chip-btn").forEach((b) => { b.onclick = () => search.setTerm(b.dataset.q); });

    // signed-in students: "My exams" first (lazy import keeps the home page light for everyone else)
    import("./shared/entitlements.js?v=11").then(async (m) => {
      const prof = await m.getMemberProfile();
      if (!prof.signedIn || !prof.purchases.length) return;
      const own = prof.purchases.filter((p) => bySlug[p.slug]);
      const pass = prof.purchases.find((p) => p.slug === m.ALL_ACCESS);
      const rows = own.map((p) => `<a class="my-exam-row" href="${p.slug}/"><span><b>${esc(bySlug[p.slug].title)}</b><small>${p.expires ? "सक्रिय — " + formatDate(p.expires) + " तक" : "सक्रिय"}</small></span><span class="resume">जारी रखें →</span></a>`);
      if (pass) rows.unshift(`<a class="my-exam-row" href="/dashboard.html"><span><b>⭐ ऑल-एक्सेस पास</b><small>सभी परीक्षाएं${pass.expires ? " — " + formatDate(pass.expires) + " तक" : ""}</small></span><span class="resume">डैशबोर्ड →</span></a>`);
      if (!rows.length) return;
      const box = document.getElementById("my-exams");
      box.innerHTML = `<h2>👋 नमस्ते${prof.name ? ", " + esc(prof.name.split(" ")[0]) : ""} — आपकी परीक्षाएं</h2>${rows.join("")}`;
      box.hidden = false;
    }).catch(() => {});
  });

  renderDaily(document.getElementById("daily-section"));
</script>

</body>
</html>
